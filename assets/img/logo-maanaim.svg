<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="churchGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="185" fill="#ffffff" stroke="#1E3A8A" stroke-width="8" />
  <circle cx="200" cy="200" r="170" fill="url(#churchGrad)" />
  
  <!-- Open Bible -->
  <g transform="translate(200, 210) scale(1.3)">
    <!-- Pages -->
    <path d="M-60,30 C-40,15 -15,18 0,30 C15,18 40,15 60,30 L60,-40 C40,-55 15,-52 0,-40 C-15,-52 -40,-55 -60,-40 Z" fill="#ffffff" />
    <path d="M-58,25 C-38,12 -14,15 0,27 C14,15 38,12 58,25 L58,-38 C38,-51 14,-48 0,-36 C-14,-48 -38,-51 -58,-38 Z" fill="#F8FAFC" />
    <!-- Spine -->
    <line x1="0" y1="-36" x2="0" y2="28" stroke="#CBD5E1" stroke-width="2.5" />
    <!-- Cross on the page -->
    <rect x="-3" y="-30" width="6" height="35" rx="2" fill="#EAB308" />
    <rect x="-15" y="-22" width="30" height="6" rx="2" fill="#EAB308" />
  </g>
  
  <!-- Church Name Circular Arc Text -->
  <text x="200" y="85" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="20" fill="#FDE047" text-anchor="middle" letter-spacing="3">
    IGREJA BATISTA REGULAR
  </text>
  <text x="200" y="115" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    MAANAIM
  </text>
  <text x="200" y="340" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="16" fill="#BAE6FD" text-anchor="middle" letter-spacing="2">
    GÊNESIS 32:2 • MINISTÉRIO OANSE
  </text>
</svg>
