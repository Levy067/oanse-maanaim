<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 580" width="100%" height="100%" style="background-color: #ffffff;">
  <!-- FRONT SHIRT (Left) -->
  <g transform="translate(60, 40)">
    <!-- Body -->
    <path d="M120,40 C160,65 240,65 280,40 L345,120 L295,145 L270,105 L270,470 L130,470 L130,105 L105,145 L55,120 Z" fill="#0A1931" stroke="#051024" stroke-width="3" />
    <!-- Collar -->
    <path d="M175,45 C190,85 210,85 225,45" fill="none" stroke="#FFFFFF" stroke-width="4" />
    <path d="M170,42 C190,95 210,95 230,42" fill="none" stroke="#051024" stroke-width="2" />
    <!-- A MISSÃO VQ7 LOGO ON FRONT CHEST -->
    <g transform="translate(200, 240) scale(1.1)">
      <circle cx="0" cy="0" r="62" fill="#FFFFFF" stroke="#0A1931" stroke-width="3" />
      <image href="assets/img/vq7.png" x="-58" y="-58" width="116" height="116" />
    </g>
  </g>

  <!-- BACK SHIRT (Right) -->
  <g transform="translate(420, 40)">
    <!-- Body -->
    <path d="M120,40 C160,55 240,55 280,40 L345,120 L295,145 L270,105 L270,470 L130,470 L130,105 L105,145 L55,120 Z" fill="#0A1931" stroke="#051024" stroke-width="3" />
    <!-- Collar back -->
    <path d="M175,42 C190,52 210,52 225,42" fill="none" stroke="#FFFFFF" stroke-width="3" />
    <!-- Small OANSE logo at top center back -->
    <g transform="translate(200, 105)">
      <rect x="-35" y="-18" width="70" height="36" rx="8" fill="#FFFFFF" opacity="0.95" />
      <image href="assets/img/oanse-logo.png" x="-32" y="-16" width="64" height="32" />
    </g>
  </g>
</svg>
