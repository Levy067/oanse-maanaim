<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="vqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#0f5132" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="6" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular background -->
  <circle cx="250" cy="220" r="180" fill="none" stroke="#222222" stroke-width="26" />
  <circle cx="250" cy="220" r="167" fill="url(#vqGrad)" filter="url(#shadow)" />

  <!-- Inner compass / target accent lines -->
  <circle cx="250" cy="220" r="145" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="3" stroke-dasharray="10 8" />
  
  <!-- Stylized VQ7 monogram -->
  <g transform="translate(250, 215) scale(1.15)">
    <!-- Shield/Mountain polygon -->
    <path d="M-80,-65 L80,-65 L60,40 L0,75 L-60,40 Z" fill="rgba(0,0,0,0.25)" />
    
    <!-- Bold 'VQ7' text stylized -->
    <text x="0" y="28" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="96" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="-2" stroke="#1c1917" stroke-width="5" paint-order="stroke fill">
      VQ7
    </text>
  </g>

  <!-- Subtitle within circle -->
  <text x="250" y="325" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="16" fill="#FDE68A" text-anchor="middle" letter-spacing="3">
    24h / 7 DIAS COM CRISTO
  </text>

  <!-- Bottom Badge: CLUBE VQ7 -->
  <g transform="translate(250, 420)">
    <!-- Pill background -->
    <rect x="-180" y="-45" width="360" height="70" rx="35" fill="#1c1917" />
    <rect x="-174" y="-39" width="348" height="58" rx="29" fill="url(#goldGrad)" />
    <!-- Text -->
    <text x="0" y="2" font-family="'Arial Black', Impact, sans-serif" font-weight="900" font-size="34" fill="#1c1917" text-anchor="middle" letter-spacing="1">
      CLUBE VQ7
    </text>
  </g>
</svg>
