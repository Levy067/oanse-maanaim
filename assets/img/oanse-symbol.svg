<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="oanseRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <linearGradient id="oanseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>
  <circle cx="200" cy="200" r="185" fill="#ffffff" stroke="#DC2626" stroke-width="10" />
  <circle cx="200" cy="200" r="168" fill="url(#oanseRed)" />
  <circle cx="200" cy="200" r="150" fill="none" stroke="#FDE047" stroke-width="4" stroke-dasharray="6 4" />
  
  <text x="200" y="95" font-family="'Arial Black', Impact, sans-serif" font-size="44" fill="#ffffff" text-anchor="middle" letter-spacing="6">
    OANSE
  </text>
  <text x="200" y="125" font-family="'Segoe UI', sans-serif" font-weight="700" font-size="13" fill="#FDE047" text-anchor="middle" letter-spacing="1.5">
    2 TIMÓTEO 2:15
  </text>

  <!-- Torch and Bible symbol in the center -->
  <g transform="translate(200, 220) scale(1.1)">
    <!-- Torch bowl -->
    <path d="M-25,10 L25,10 L15,55 L-15,55 Z" fill="#1E293B" />
    <path d="M-20,18 L20,18 L13,50 L-13,50 Z" fill="#334155" />
    <rect x="-28" y="5" width="56" height="8" rx="4" fill="url(#oanseGold)" />
    <!-- Flame -->
    <path d="M0,-55 C25,-25 35,0 18,12 C8,18 -8,18 -18,12 C-35,0 -25,-25 0,-55 Z" fill="#F59E0B" />
    <path d="M0,-42 C15,-20 22,0 12,8 C5,12 -5,12 -12,8 C-22,0 -15,-20 0,-42 Z" fill="#FEF08A" />
  </g>

  <!-- Bottom Banner -->
  <text x="200" y="325" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="14" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    OBREIRO APROVADO
  </text>
  <text x="200" y="348" font-family="'Segoe UI', sans-serif" font-weight="800" font-size="13" fill="#FDE047" text-anchor="middle" letter-spacing="1">
    NÃO SE ENVERGONHA
  </text>
</svg>
